[pytest]
testpaths = tests/test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    smoke: tests rápidos de humo
    regression: tests de regresión completos
    admin: tests que requieren usuario admin
    auth: tests de autenticación
    movies: tests de películas
    marathons: tests de maratones
    reviews: tests de reseñas
    navigation: tests de navegación